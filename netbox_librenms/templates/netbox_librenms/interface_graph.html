<style>
    /* Styling for premium LibreNMS integration */
    .librenms-graph-card {
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        border: 1px solid rgba(0, 0, 0, 0.05);
        margin-bottom: 24px;
        background: #fff;
        overflow: hidden;
    }
    .librenms-graph-card-header {
        background: linear-gradient(135deg, #1f4068, #162447);
        color: #fff;
        padding: 10px 14px;
        font-weight: 600;
        font-size: 0.95rem;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: space-between;
        align-items: center;
    }
    .librenms-status-pulse {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
    }
    .status-up {
        background-color: #2ed573;
        box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7);
        animation: pulse-green 2s infinite;
    }
    .status-down {
        background-color: #ff4757;
        box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7);
        animation: pulse-red 2s infinite;
    }
    @keyframes pulse-green {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 213, 115, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 213, 115, 0); }
    }
    @keyframes pulse-red {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(255, 71, 87, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
    }
    .graph-container {
        padding: 12px;
        text-align: center;
        background: #fafafa;
        border-top: 1px solid #eee;
    }
    .graph-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: center;
        align-items: center;
    }
    .graph-btn {
        background-color: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: rgba(255, 255, 255, 0.9);
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.75rem;
        cursor: pointer;
        transition: all 0.2s;
    }
    .graph-btn.active, .graph-btn:hover {
        background-color: #fff;
        color: #1f4068;
        border-color: #fff;
        font-weight: 500;
    }
    .graph-img-wrapper {
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #eee;
        padding: 8px;
    }
    .custom-range-panel {
        background: rgba(0, 0, 0, 0.03);
        border-radius: 8px;
        padding: 10px;
        margin-top: 8px;
        border: 1px solid rgba(0, 0, 0, 0.05);
    }
    .uptime-stats-panel {
        text-align: left;
        background: #fff;
        border-radius: 8px;
        padding: 12px;
        margin-top: 12px;
        border: 1px solid #eee;
    }
    .uptime-stats-title {
        font-weight: 600;
        font-size: 0.85rem;
        color: #333;
        text-transform: uppercase;
        border-bottom: 2px solid #eee;
        padding-bottom: 6px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
</style>

<div class="card librenms-graph-card librenms-traffic-card" id="librenms-traffic-card">
    <div class="librenms-graph-card-header">
        <div class="d-flex align-items-center">
            <span class="librenms-status-pulse status-up" id="librenms-status-indicator"></span>
            <span>LibreNMS Interface Traffic</span>
        </div>
        <div class="graph-controls">
            <button class="graph-btn active" data-range="24h">24h</button>
            <button class="graph-btn" data-range="48h">48h</button>
            <button class="graph-btn" data-range="7d">7d</button>
            <button class="graph-btn" data-range="30d">30d</button>
            <button class="graph-btn" data-range="1y">1y</button>
            <button class="graph-btn" id="btn-custom-range" data-range="custom"><i class="mdi mdi-calendar-clock"></i> Custom</button>
        </div>
    </div>
    
    <div class="graph-container">
        <!-- Custom Range Date Time Pickers -->
        <div id="custom-range-panel" class="custom-range-panel d-none text-start">
            <div class="row g-2 align-items-end">
                <div class="col-sm-5">
                    <label class="form-label fs-7 text-muted fw-bold">Start Date & Time</label>
                    <input type="datetime-local" id="custom-start-time" class="form-control form-control-sm" />
                </div>
                <div class="col-sm-5">
                    <label class="form-label fs-7 text-muted fw-bold">End Date & Time</label>
                    <input type="datetime-local" id="custom-end-time" class="form-control form-control-sm" />
                </div>
                <div class="col-sm-2 d-grid">
                    <button type="button" id="btn-apply-custom-range" class="btn btn-sm btn-primary fw-bold text-white">Apply</button>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="librenms-loading" class="d-flex flex-column justify-content-center align-items-center py-5">
            <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <span class="mt-3 text-muted fw-semibold">Querying LibreNMS for interface graph...</span>
        </div>

        <!-- Error Alert -->
        <div id="librenms-error" class="alert alert-warning d-none text-start" role="alert">
            <h5 class="alert-heading fw-bold d-flex align-items-center gap-2">
                <i class="mdi mdi-alert-circle"></i> LibreNMS Mapping Warning
            </h5>
            <p id="librenms-error-msg" class="mb-0">Failed to load LibreNMS graph.</p>
        </div>

        <!-- Graph Image Wrapper with Interactive Hover Elements -->
        <div id="librenms-graph-wrapper" class="graph-img-wrapper d-none position-relative" style="user-select: none; cursor: crosshair;">
            <img id="librenms-interface-graph-img" src="" alt="Interface Traffic Graph" class="img-fluid" style="width: 100%; height: auto; display: block;" />
            
            <!-- Hover Guides -->
            <div id="graph-hover-line-x" style="position: absolute; top: 0; bottom: 0; width: 1px; border-left: 1px dashed #22a6b3; display: none; pointer-events: none; z-index: 10;"></div>
            <div id="graph-hover-line-y" style="position: absolute; left: 0; right: 0; height: 1px; border-top: 1px dashed #22a6b3; display: none; pointer-events: none; z-index: 10;"></div>
            
            <!-- Hover Tooltip -->
            <div id="graph-hover-tooltip" style="position: absolute; display: none; background: rgba(15, 23, 42, 0.95); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 0.725rem; font-family: monospace; border: 1px solid #22a6b3; box-shadow: 0 4px 15px rgba(0,0,0,0.3); pointer-events: none; z-index: 20; text-align: left; line-height: 1.4; min-width: 180px;"></div>
        </div>

        <!-- Uptime / Downtime Stats Log Panel -->
        <div id="librenms-uptime-panel" class="uptime-stats-panel d-none">
            <div class="uptime-stats-title">
                <span><i class="mdi mdi-clock-check-outline text-success"></i> Downtime & Uptime Status</span>
                <span id="device-uptime-badge" class="badge bg-secondary text-white">Device Uptime: Loading...</span>
            </div>

            <!-- Current Downtime Alert (if down) -->
            <div id="current-downtime-alert" class="alert alert-danger py-2 px-3 mb-2 d-none" role="alert">
                <i class="mdi mdi-alert-circle"></i> <strong>Current Status: Down</strong> since <span id="current-down-since"></span> (Duration: <span id="current-down-duration"></span>)
            </div>

            <div id="uptime-log-container">
                <table class="table table-sm table-hover align-middle mb-0 fs-7">
                    <thead>
                        <tr class="table-light">
                            <th>Link Lost (Down)</th>
                            <th>Link Recovered (Up)</th>
                            <th class="text-end">Downtime Duration</th>
                        </tr>
                    </thead>
                    <tbody id="uptime-log-body">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const cards = document.querySelectorAll('.librenms-traffic-card');
        if (cards.length > 1) {
            for (let i = 1; i < cards.length; i++) {
                cards[i].remove();
            }
        }
        const cardEl = document.getElementById("librenms-traffic-card");
        if (cardEl) {
            const column = cardEl.closest('.col') || cardEl.closest('[class*="col-"]') || cardEl.parentElement;
            if (column) {
                column.insertBefore(cardEl, column.firstChild);
            }
        }

        const imgEl = document.getElementById('librenms-interface-graph-img');
        const loadingEl = document.getElementById('librenms-loading');
        const errorEl = document.getElementById('librenms-error');
        const errorMsgEl = document.getElementById('librenms-error-msg');
        const wrapperEl = document.getElementById('librenms-graph-wrapper');
        const rangeButtons = document.querySelectorAll('.graph-btn');
        const customRangePanel = document.getElementById('custom-range-panel');
        const customStartInput = document.getElementById('custom-start-time');
        const customEndInput = document.getElementById('custom-end-time');
        const btnApplyCustom = document.getElementById('btn-apply-custom-range');
        const statusIndicator = document.getElementById('librenms-status-indicator');

        // Uptime elements
        const uptimePanel = document.getElementById('librenms-uptime-panel');
        const deviceUptimeBadge = document.getElementById('device-uptime-badge');
        const currentDownAlert = document.getElementById('current-downtime-alert');
        const currentDownSince = document.getElementById('current-down-since');
        const currentDownDuration = document.getElementById('current-down-duration');
        const uptimeLogBody = document.getElementById('uptime-log-body');

        // Hover elements
        const hoverLineX = document.getElementById('graph-hover-line-x');
        const hoverLineY = document.getElementById('graph-hover-line-y');
        const hoverTooltip = document.getElementById('graph-hover-tooltip');

        const baseUrl = "{% url 'plugins:netbox_librenms:interface_librenms-graph' pk=object.pk %}";
        const statsUrl = "{% url 'plugins:netbox_librenms:interface_librenms-uptime-status' pk=object.pk %}";

        let currentRange = "24h";
        let downtimeData = [];
        let currentDowntimeData = null;

        // Set default custom dates (start = 24h ago, end = now)
        const now = new Date();
        const past24h = new Date(now.getTime() - (24 * 60 * 60 * 1000));
        
        function formatDateTimeLocal(date) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }
        
        customStartInput.value = formatDateTimeLocal(past24h);
        customEndInput.value = formatDateTimeLocal(now);

        function loadGraph(range, customParams = '') {
            if (!imgEl) return;
            currentRange = range;
            loadingEl.classList.remove('d-none');
            errorEl.classList.add('d-none');
            wrapperEl.classList.add('d-none');

            let src = baseUrl + "?range=" + range;
            if (customParams) {
                src += customParams;
            }
            src += "&_ts=" + new Date().getTime();
            imgEl.src = src;
        }

        async function fetchUptimeStats() {
            try {
                const res = await fetch(statsUrl);
                if (res.ok) {
                    const data = await res.json();
                    downtimeData = data.downtimes || [];
                    currentDowntimeData = data.current_downtime || null;
                    
                    // Update system status pulse
                    if (data.device_status === "Up") {
                        statusIndicator.className = "librenms-status-pulse status-up";
                    } else {
                        statusIndicator.className = "librenms-status-pulse status-down";
                    }

                    deviceUptimeBadge.textContent = "Device Uptime: " + data.device_uptime;
                    
                    // Current downtime
                    if (data.current_downtime) {
                        currentDownAlert.classList.remove('d-none');
                        currentDownSince.textContent = data.current_downtime.down_since;
                        currentDownDuration.textContent = data.current_downtime.duration;
                    } else {
                        currentDownAlert.classList.add('d-none');
                    }

                    // Historical Downtimes table
                    uptimeLogBody.innerHTML = '';
                    if (downtimeData.length > 0) {
                        downtimeData.forEach(row => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td class="text-danger fw-semibold"><i class="mdi mdi-close-network"></i> ${row.down_time}</td>
                                <td class="text-success fw-semibold"><i class="mdi mdi-check-network"></i> ${row.up_time}</td>
                                <td class="text-end fw-bold text-dark">${row.duration}</td>
                            `;
                            uptimeLogBody.appendChild(tr);
                        });
                    } else {
                        uptimeLogBody.innerHTML = `
                            <tr>
                                <td colspan="3" class="text-center text-muted py-3">
                                    <i class="mdi mdi-shield-check-outline text-success fs-4 d-block mb-1"></i>
                                    No downtime events recorded in LibreNMS logs for this port.
                                </td>
                            </tr>
                        `;
                    }
                    uptimePanel.classList.remove('d-none');
                }
            } catch (e) {
                console.error("Failed to load uptime statistics:", e);
            }
        }

        if (imgEl) {
            imgEl.onload = function() {
                loadingEl.classList.add('d-none');
                wrapperEl.classList.remove('d-none');
                errorEl.classList.add('d-none');
            };

            imgEl.onerror = async function() {
                loadingEl.classList.add('d-none');
                wrapperEl.classList.add('d-none');
                errorEl.classList.remove('d-none');

                try {
                    const res = await fetch(imgEl.src);
                    if (!res.ok) {
                        const text = await res.text();
                        errorMsgEl.textContent = text || "Failed to load LibreNMS graph image.";
                    } else {
                        errorMsgEl.textContent = "Failed to load LibreNMS graph image.";
                    }
                } catch (e) {
                    errorMsgEl.textContent = "Failed to connect to LibreNMS or retrieve graph details.";
                }
            };
        }

        rangeButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                rangeButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const range = this.getAttribute('data-range');
                if (range === 'custom') {
                    customRangePanel.classList.remove('d-none');
                } else {
                    customRangePanel.classList.add('d-none');
                    loadGraph(range);
                }
            });
        });

        btnApplyCustom.addEventListener('click', function() {
            const startVal = customStartInput.value;
            const endVal = customEndInput.value;
            if (!startVal) return;
            
            const formatTime = (isoStr) => isoStr.replace('T', ' ');
            const params = `&from=${encodeURIComponent(formatTime(startVal))}` + (endVal ? `&to=${encodeURIComponent(formatTime(endVal))}` : '');
            loadGraph('custom', params);
        });

        // Graph Interactive Mouse Hover Logic
        wrapperEl.addEventListener('mousemove', function(e) {
            if (!imgEl || loadingEl.classList.contains('d-none') === false) return;
            
            const rect = imgEl.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const pctX = mouseX / rect.width;
            const pctY = mouseY / rect.height;
            
            // Plot Area boundary boundaries for standard LibreNMS graphs
            const plotXStart = 0.093;
            const plotXEnd = 0.955;
            const plotYStart = 0.08;
            const plotYEnd = 0.765;
            
            if (pctX >= plotXStart && pctX <= plotXEnd && pctY >= plotYStart && pctY <= plotYEnd) {
                // Calculate position relative to the inner plot area (0 to 1)
                const relX = (pctX - plotXStart) / (plotXEnd - plotXStart);
                const relY = (plotYEnd - pctY) / (plotYEnd - plotYStart); // 0 at bottom, 1 at top
                
                // Calculate timestamp
                let endTime = new Date();
                let startTime = new Date(endTime.getTime() - (24 * 60 * 60 * 1000));
                
                if (currentRange === '48h') {
                    startTime = new Date(endTime.getTime() - (48 * 60 * 60 * 1000));
                } else if (currentRange === '7d') {
                    startTime = new Date(endTime.getTime() - (7 * 24 * 60 * 60 * 1000));
                } else if (currentRange === '30d') {
                    startTime = new Date(endTime.getTime() - (30 * 24 * 60 * 60 * 1000));
                } else if (currentRange === '1y') {
                    startTime = new Date(endTime.getTime() - (365 * 24 * 60 * 60 * 1000));
                } else if (currentRange === 'custom') {
                    startTime = new Date(customStartInput.value);
                    endTime = customEndInput.value ? new Date(customEndInput.value) : new Date();
                }
                
                const hoverTimeMs = startTime.getTime() + relX * (endTime.getTime() - startTime.getTime());
                const hoverDate = new Date(hoverTimeMs);
                
                // Format hover Date and Time
                const dateOpts = { 
                    weekday: 'short', 
                    month: 'short', 
                    day: 'numeric', 
                    hour: '2-digit', 
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true 
                };
                const formattedTime = hoverDate.toLocaleDateString('en-US', dateOpts);
                
                // Cross-reference with downtime ranges
                let statusLabel = '<span style="color: #2ed573; font-weight: bold;">✓ Active (Traffic Flowing)</span>';
                
                if (downtimeData.length > 0) {
                    for (let i = 0; i < downtimeData.length; i++) {
                        const dt = downtimeData[i];
                        const tDown = new Date(dt.down_time).getTime();
                        const tUp = new Date(dt.up_time).getTime();
                        if (hoverTimeMs >= tDown && hoverTimeMs <= tUp) {
                            statusLabel = '<span style="color: #ff4757; font-weight: bold;">⚠️ LINK DOWN (Downtime Period)</span>';
                            break;
                        }
                    }
                }
                
                if (currentDowntimeData) {
                    const tDown = new Date(currentDowntimeData.down_since).getTime();
                    if (hoverTimeMs >= tDown) {
                        statusLabel = '<span style="color: #ff4757; font-weight: bold;">⚠️ LINK DOWN (Downtime Period)</span>';
                    }
                }
                
                // Update guides position
                hoverLineX.style.left = `${mouseX}px`;
                hoverLineX.style.display = 'block';
                
                hoverLineY.style.top = `${mouseY}px`;
                hoverLineY.style.display = 'block';
                
                // Position and populate Tooltip
                hoverTooltip.innerHTML = `
                    <div style="border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 4px; margin-bottom: 6px; font-weight: bold; color: #22a6b3;">
                        <i class="mdi mdi-chart-line"></i> Interface Stats
                    </div>
                    <div style="margin-bottom: 4px;"><strong>Time:</strong> ${formattedTime}</div>
                    <div style="margin-bottom: 4px;"><strong>Usage Level:</strong> ${(relY * 100).toFixed(0)}% of max</div>
                    <div><strong>Status:</strong> ${statusLabel}</div>
                `;
                
                let tooltipLeft = mouseX + 15;
                if (tooltipLeft + 190 > rect.width) {
                    tooltipLeft = mouseX - 190 - 15;
                }
                hoverTooltip.style.left = `${tooltipLeft}px`;
                
                let tooltipTop = mouseY + 15;
                if (tooltipTop + 100 > rect.height) {
                    tooltipTop = rect.height - 100;
                }
                hoverTooltip.style.top = `${tooltipTop}px`;
                hoverTooltip.style.display = 'block';
            } else {
                hideHoverGuides();
            }
        });
        
        wrapperEl.addEventListener('mouseleave', function() {
            hideHoverGuides();
        });
        
        function hideHoverGuides() {
            hoverLineX.style.display = 'none';
            hoverLineY.style.display = 'none';
            hoverTooltip.style.display = 'none';
        }

        // Initial loads
        loadGraph("24h");
        fetchUptimeStats();
    })();
</script>
