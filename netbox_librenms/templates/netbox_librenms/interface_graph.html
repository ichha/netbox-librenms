<style>
    /* Styling for premium LibreNMS integration */
    .librenms-graph-card {
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        border: 1px solid rgba(0, 0, 0, 0.05);
        margin-bottom: 24px;
        background: #fff;
        overflow: hidden;
    }
    .librenms-graph-card-header {
        background: linear-gradient(135deg, #1f4068, #162447);
        color: #fff;
        padding: 10px 14px;
        font-weight: 600;
        font-size: 0.95rem;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: space-between;
        align-items: center;
    }
    .librenms-status-pulse {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 6px;
    }
    .status-up {
        background-color: #2ed573;
        box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7);
        animation: pulse-green 2s infinite;
    }
    @keyframes pulse-green {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 213, 115, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 213, 115, 0); }
    }
    .graph-container {
        padding: 12px;
        text-align: center;
        background: #fafafa;
        border-top: 1px solid #eee;
    }
    .graph-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: center;
    }
    .graph-btn {
        background-color: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: rgba(255, 255, 255, 0.9);
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.75rem;
        cursor: pointer;
        transition: all 0.2s;
    }
    .graph-btn.active, .graph-btn:hover {
        background-color: #fff;
        color: #1f4068;
        border-color: #fff;
        font-weight: 500;
    }
    .graph-img-wrapper {
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        border-radius: 6px;
        border: 1px solid #eee;
        padding: 8px;
    }
    .custom-time-panel {
        padding: 10px 14px;
        background: #fafafa;
        border-bottom: 1px solid #eee;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: center;
    }
</style>

<div class="card librenms-graph-card librenms-traffic-card" id="librenms-traffic-card">
    <div class="librenms-graph-card-header">
        <div class="d-flex align-items-center">
            <span class="librenms-status-pulse status-up"></span>
            <span>LibreNMS Interface Traffic</span>
        </div>
        <div class="graph-controls">
            <button class="graph-btn active" data-range="24h">24h</button>
            <button class="graph-btn" data-range="48h">48h</button>
            <button class="graph-btn" data-range="7d">7d</button>
            <button class="graph-btn" data-range="30d">30d</button>
            <button class="graph-btn" data-range="1y">1y</button>
            <button class="graph-btn" data-range="custom">Custom</button>
        </div>
    </div>
    
    <!-- Custom Time Range Collapsible Input Panel -->
    <div id="custom-time-inputs" class="custom-time-panel d-none">
        <div class="d-flex align-items-center gap-2">
            <label for="custom-start" class="form-label mb-0 fw-semibold text-muted" style="font-size: 0.8rem;">Start:</label>
            <input type="datetime-local" id="custom-start" class="form-control form-control-sm" style="width: auto; height: 30px; font-size: 0.8rem; padding: 2px 6px;" />
        </div>
        <div class="d-flex align-items-center gap-2">
            <label for="custom-end" class="form-label mb-0 fw-semibold text-muted" style="font-size: 0.8rem;">End:</label>
            <input type="datetime-local" id="custom-end" class="form-control form-control-sm" style="width: auto; height: 30px; font-size: 0.8rem; padding: 2px 6px;" />
        </div>
        <button id="apply-custom-range" class="btn btn-sm btn-primary fw-semibold" style="height: 30px; font-size: 0.8rem; padding: 4px 12px; border-radius: 4px;">Apply</button>
    </div>
    
    <div class="graph-container">
        <!-- Loading Spinner -->
        <div id="librenms-loading" class="d-flex flex-column justify-content-center align-items-center py-5">
            <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
            <span class="mt-3 text-muted fw-semibold">Querying LibreNMS for interface graph...</span>
        </div>

        <!-- Error Alert -->
        <div id="librenms-error" class="alert alert-warning d-none text-start" role="alert">
            <h5 class="alert-heading fw-bold d-flex align-items-center gap-2">
                <i class="mdi mdi-alert-circle"></i> LibreNMS Mapping Warning
            </h5>
            <p id="librenms-error-msg" class="mb-0">Failed to load LibreNMS graph.</p>
        </div>

        <!-- Graph Image Wrapper -->
        <div id="librenms-graph-wrapper" class="graph-img-wrapper d-none" style="position: relative; overflow: hidden; display: block; width: 100%;">
            <img id="librenms-interface-graph-img" src="" alt="Interface Traffic Graph" class="img-fluid" style="width: 100%; height: auto; display: block;" />
            <!-- Crosshair overlay elements -->
            <div id="crosshair-x" style="position: absolute; width: 1px; background-color: rgba(220, 53, 69, 0.85); pointer-events: none; display: none; z-index: 10;"></div>
            <div id="crosshair-tooltip" style="position: absolute; background: #1e293b; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; pointer-events: none; display: none; z-index: 11; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.15); font-weight: 500;"></div>
        </div>
    </div>
</div>

<script>
    (function() {
        // De-duplicate the card if NetBox renders it on multiple injection hooks
        const cards = document.querySelectorAll('.librenms-traffic-card');
        if (cards.length > 1) {
            for (let i = 1; i < cards.length; i++) {
                cards[i].remove();
            }
        }
        const cardEl = document.getElementById("librenms-traffic-card");
        if (cardEl) {
            // Find the Bootstrap column container (the right column) and move the card to the top
            const column = cardEl.closest('.col') || cardEl.closest('[class*="col-"]') || cardEl.parentElement;
            if (column) {
                column.insertBefore(cardEl, column.firstChild);
            }
        }

        const imgEl = document.getElementById('librenms-interface-graph-img');
        const loadingEl = document.getElementById('librenms-loading');
        const errorEl = document.getElementById('librenms-error');
        const errorMsgEl = document.getElementById('librenms-error-msg');
        const wrapperEl = document.getElementById('librenms-graph-wrapper');
        const rangeButtons = document.querySelectorAll('.graph-btn');
        
        const customInputsEl = document.getElementById('custom-time-inputs');
        const startInputEl = document.getElementById('custom-start');
        const endInputEl = document.getElementById('custom-end');
        const applyBtnEl = document.getElementById('apply-custom-range');
        
        const crosshairLine = document.getElementById('crosshair-x');
        const crosshairTooltip = document.getElementById('crosshair-tooltip');

        const baseUrl = "{% url 'plugins:netbox_librenms:interface_librenms-graph' pk=object.pk %}";
        let currentRange = "24h";

        // Pre-fill datetime-local inputs with local timezone defaults
        const now = new Date();
        const oneDayAgo = new Date(now.getTime() - 24 * 60 * 60 * 1000);
        
        function formatDateTimeLocal(date) {
            const tzoffset = date.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(date.getTime() - tzoffset)).toISOString().slice(0, -1);
            return localISOTime.substring(0, 16);
        }
        
        startInputEl.value = formatDateTimeLocal(oneDayAgo);
        endInputEl.value = formatDateTimeLocal(now);

        function loadGraph(range) {
            if (!imgEl) return;
            loadingEl.classList.remove('d-none');
            errorEl.classList.add('d-none');
            wrapperEl.classList.add('d-none');

            let queryUrl = baseUrl + "?range=" + range + "&_ts=" + new Date().getTime();
            if (range === "custom") {
                const startSecs = Math.floor(new Date(startInputEl.value).getTime() / 1000);
                const endSecs = Math.floor(new Date(endInputEl.value).getTime() / 1000);
                if (startSecs && endSecs) {
                    queryUrl += "&from=" + startSecs + "&to=" + endSecs;
                }
            }

            imgEl.src = queryUrl;
        }

        if (imgEl) {
            imgEl.onload = function() {
                loadingEl.classList.add('d-none');
                wrapperEl.classList.remove('d-none');
                errorEl.classList.add('d-none');
            };

            imgEl.onerror = async function() {
                loadingEl.classList.add('d-none');
                wrapperEl.classList.add('d-none');
                errorEl.classList.remove('d-none');

                try {
                    const res = await fetch(imgEl.src);
                    if (!res.ok) {
                        const text = await res.text();
                        errorMsgEl.textContent = text || "Failed to load LibreNMS graph image.";
                    } else {
                        errorMsgEl.textContent = "Failed to load LibreNMS graph image.";
                    }
                } catch (e) {
                    errorMsgEl.textContent = "Failed to connect to LibreNMS or retrieve graph details.";
                }
            };

            // Crosshair interaction on mousemove over the graph image
            imgEl.addEventListener('mousemove', function(e) {
                const rect = imgEl.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const relX = x / rect.width;
                
                // RRDTool graph area is precisely between X = 10.0% and X = 94.2%
                const graphStart = 0.100;
                const graphEnd = 0.942;
                
                if (relX >= graphStart && relX <= graphEnd) {
                    const lineX = x + imgEl.offsetLeft;
                    
                    crosshairLine.style.left = lineX + 'px';
                    crosshairLine.style.top = imgEl.offsetTop + 'px';
                    crosshairLine.style.height = imgEl.offsetHeight + 'px';
                    crosshairLine.style.display = 'block';

                    const t_ratio = (relX - graphStart) / (graphEnd - graphStart);
                    const timeStr = calculateTimeAt(t_ratio);

                    crosshairTooltip.style.left = (lineX + 12) + 'px';
                    const cursorY = e.clientY - rect.top;
                    crosshairTooltip.style.top = (cursorY + imgEl.offsetTop - 15) + 'px';
                    crosshairTooltip.textContent = timeStr;
                    crosshairTooltip.style.display = 'block';
                } else {
                    crosshairLine.style.display = 'none';
                    crosshairTooltip.style.display = 'none';
                }
            });

            imgEl.addEventListener('mouseleave', function() {
                crosshairLine.style.display = 'none';
                crosshairTooltip.style.display = 'none';
            });
        }

        function calculateTimeAt(t_ratio) {
            let startTime, endTime;
            const now = new Date();
            
            if (currentRange === "24h") {
                startTime = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                endTime = now;
            } else if (currentRange === "48h") {
                startTime = new Date(now.getTime() - 48 * 60 * 60 * 1000);
                endTime = now;
            } else if (currentRange === "7d") {
                startTime = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                endTime = now;
            } else if (currentRange === "30d") {
                startTime = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
                endTime = now;
            } else if (currentRange === "1y") {
                startTime = new Date(now.getTime() - 365 * 24 * 60 * 60 * 1000);
                endTime = now;
            } else if (currentRange === "custom") {
                startTime = startInputEl.value ? new Date(startInputEl.value) : new Date(now.getTime() - 24 * 60 * 60 * 1000);
                endTime = endInputEl.value ? new Date(endInputEl.value) : now;
            } else {
                startTime = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                endTime = now;
            }

            const duration = endTime.getTime() - startTime.getTime();
            const hoveredTime = new Date(startTime.getTime() + t_ratio * duration);
            
            const hours = String(hoveredTime.getHours()).padStart(2, '0');
            const minutes = String(hoveredTime.getMinutes()).padStart(2, '0');
            
            const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            
            const dayName = dayNames[hoveredTime.getDay()];
            const monthName = monthNames[hoveredTime.getMonth()];
            const day = hoveredTime.getDate();
            
            if (duration <= 48 * 60 * 60 * 1000) {
                return `${dayName}, ${monthName} ${day} — ${hours}:${minutes}`;
            } else if (duration <= 30 * 24 * 60 * 60 * 1000) {
                return `${dayName}, ${monthName} ${day} — ${hours}:${minutes}`;
            } else {
                const year = hoveredTime.getFullYear();
                return `${year}-${String(hoveredTime.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')} — ${hours}:${minutes}`;
            }
        }

        rangeButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                rangeButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const range = this.getAttribute('data-range');
                currentRange = range;

                if (range === "custom") {
                    customInputsEl.classList.remove('d-none');
                } else {
                    customInputsEl.classList.add('d-none');
                    loadGraph(range);
                }
            });
        });

        applyBtnEl.addEventListener('click', function() {
            loadGraph("custom");
        });

        // Initial load
        loadGraph(currentRange);
    })();
</script>
